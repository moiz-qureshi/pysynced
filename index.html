<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#03112c" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#eef5ff" media="(prefers-color-scheme: light)" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,300..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <title>PSynced — The "P" Is for Your Plays</title>
  <style>
    :root{
      color-scheme:light dark;
      --bg:#03112c;--bg-2:#071b43;--panel:#081c43;--ink:#f5f9ff;--muted:#9db4d6;
      --line:rgba(173,207,255,.19);--line-2:rgba(173,207,255,.42);--blue:#2478ff;
      --blue-2:#56c7ff;--blue-soft:rgba(36,120,255,.19);--good:#52e6ba;
      --shadow:rgba(0,5,23,.48);--grid:rgba(112,174,255,.055)
    }
    @media(prefers-color-scheme:light){:root{
      --bg:#eef5ff;--bg-2:#dbeaff;--panel:#f9fbff;--ink:#061631;--muted:#506985;
      --line:rgba(15,71,147,.16);--line-2:rgba(15,71,147,.38);--blue:#075ed7;
      --blue-2:#087da9;--blue-soft:rgba(7,94,215,.12);--good:#087f65;
      --shadow:rgba(21,58,105,.15);--grid:rgba(29,88,164,.055)
    }}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100svh;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:"Archivo",sans-serif}
    body:before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),radial-gradient(circle at 78% 6%,var(--blue-soft),transparent 30%),linear-gradient(145deg,var(--bg),var(--bg-2));background-size:48px 48px,48px 48px,auto,auto}
    body:after{content:"";position:fixed;inset:0;z-index:20;pointer-events:none;opacity:.16;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.14) 3px 4px);mix-blend-mode:multiply}
    a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 40px));margin-inline:auto}.mono{font-family:"IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.1em}:focus-visible{outline:3px solid var(--blue-2);outline-offset:4px}
    .mast{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:max(18px,env(safe-area-inset-top)) 0 0;font:500 10px/1.2 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
    .ready{display:flex;align-items:center;gap:9px}.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 5px color-mix(in srgb,var(--good) 18%,transparent),0 0 22px var(--good);animation:blink 1.7s steps(2,end) infinite}.countdown{display:flex;align-items:center;gap:8px}.countdown:before{content:"";width:28px;height:1px;background:var(--line-2)}
    .hero{min-height:calc(100svh - 42px);display:grid;align-content:center;padding:68px 0 88px}.hero-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(340px,.92fr);gap:clamp(48px,8vw,110px);align-items:center}.eyebrow{margin:0 0 24px;color:var(--blue-2);font:500 11px/1.3 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.14em}.hero h1{margin:0;max-width:770px;font-size:clamp(56px,8vw,112px);line-height:.87;letter-spacing:-.067em;text-transform:uppercase;font-weight:850;font-stretch:condensed}.hero h1>span{display:block}.hero h1 .outline{color:transparent;-webkit-text-stroke:1.5px var(--ink)}.tagline{display:block;margin-top:22px;font:500 clamp(15px,1.7vw,20px)/1.2 "IBM Plex Mono",monospace;color:var(--blue-2)}.lede{max-width:630px;margin:30px 0;font-size:clamp(18px,2vw,23px);line-height:1.5;letter-spacing:-.02em;color:var(--muted)}
    .signal-link{display:inline-flex;align-items:center;gap:12px;min-height:52px;border:1px solid var(--line-2);padding:0 18px;background:var(--blue);color:#fff;box-shadow:6px 6px 0 var(--blue-soft);font:600 11px/1 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.09em;transition:transform .18s ease,box-shadow .18s ease}.signal-link:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 var(--blue-soft)}.signal-link:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--blue-soft)}
    .console{position:relative;aspect-ratio:1;display:grid;place-items:center}.orbit{position:absolute;border:1px solid var(--line-2);border-radius:50%;inset:4%;animation:spin 16s linear infinite}.orbit.two{inset:19%;border-style:dashed;animation-duration:11s;animation-direction:reverse}.orbit.three{inset:35%;animation-duration:7s}.orbit:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--blue-2);box-shadow:0 0 22px var(--blue-2);top:13%;left:14%}.orbit.two:after{left:auto;right:-5px;top:50%}.orbit.three:after{top:auto;bottom:-5px;left:48%;background:var(--blue)}.console-core{position:relative;width:23%;aspect-ratio:1;border:1px solid var(--line-2);background:var(--panel);display:grid;place-items:center;transform:rotate(45deg);box-shadow:0 0 90px var(--blue-soft)}.console-core:before,.console-core:after{content:"";position:absolute;inset:20%;border:1px solid var(--blue);animation:pulse 2.2s ease-in-out infinite}.console-core:after{inset:39%;background:var(--blue);box-shadow:0 0 22px var(--blue);animation-delay:-.8s}.console-label{position:absolute;bottom:7%;font:500 10px/1.4 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}
    .transmission{padding:110px 0;border-top:1px solid var(--line)}.transmission-head{display:grid;grid-template-columns:190px 1fr;gap:30px;margin-bottom:60px}.section-label{margin:7px 0 0;color:var(--blue-2);font:500 10px/1.3 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.13em}.transmission h2{margin:0;font-size:clamp(44px,7vw,92px);line-height:.91;letter-spacing:-.06em;text-transform:uppercase}.transmission h2 span{color:transparent;-webkit-text-stroke:1px var(--ink)}
    .signal-stage{position:relative;min-height:420px;border:1px solid var(--line-2);background:color-mix(in srgb,var(--panel) 86%,transparent);box-shadow:14px 14px 0 var(--shadow);overflow:hidden;display:grid;place-items:center;padding:48px}.signal-stage:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 49.9%,var(--line) 50%,transparent 50.1%),linear-gradient(transparent 0 49.9%,var(--line) 50%,transparent 50.1%);background-size:92px 92px;opacity:.4}.signal-route{position:relative;width:min(820px,100%);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;gap:60px}.signal-route:before{content:"";position:absolute;z-index:0;left:10%;right:10%;top:50%;height:1px;background:linear-gradient(90deg,var(--blue),var(--blue-2),var(--blue))}.packet{position:absolute;z-index:2;top:calc(50% - 4px);left:10%;width:8px;height:8px;border-radius:50%;background:var(--blue-2);box-shadow:0 0 20px 5px var(--blue-2);animation:route 2.5s cubic-bezier(.65,0,.35,1) infinite}.node{position:relative;z-index:1;min-height:118px;display:grid;place-content:center;text-align:center;border:1px solid var(--line-2);background:var(--bg);font-size:20px;font-weight:700}.node small{display:block;margin-top:8px;color:var(--muted);font:500 9px/1.2 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.1em}.node.mystery{border-style:dashed;color:var(--blue-2)}.node.mystery strong{letter-spacing:.25em;animation:decode 2.5s steps(2,end) infinite}.stage-caption{position:absolute;bottom:18px;left:20px;right:20px;display:flex;justify-content:space-between;gap:16px;color:var(--muted);font:500 9px/1.3 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.12em}
    .closing{padding:125px 0 max(72px,env(safe-area-inset-bottom));text-align:center}.closing .mark{width:13px;height:13px;margin:0 auto 34px;background:var(--blue);transform:rotate(45deg);box-shadow:0 0 32px var(--blue);animation:pulse 2.2s ease-in-out infinite}.closing h2{margin:0;font-size:clamp(52px,10vw,126px);line-height:.85;letter-spacing:-.07em;text-transform:uppercase}.closing p{margin:30px auto 0;color:var(--blue-2);font:500 clamp(14px,2vw,19px)/1.4 "IBM Plex Mono",monospace}.closing small{display:block;margin-top:18px;color:var(--muted);font:500 10px/1.4 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.13em}
    .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}.reveal.seen{opacity:1;transform:none}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:rotate(45deg) scale(.72);opacity:.45}}@keyframes blink{50%{opacity:.35}}@keyframes route{0%{left:10%;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:89%;opacity:0}}@keyframes decode{50%{opacity:.38;filter:blur(1px)}}
    @media(max-width:850px){.hero{min-height:auto;padding:62px 0 96px}.hero-grid{grid-template-columns:1fr}.console{width:min(72vw,430px);margin:auto;order:-1}.transmission-head{grid-template-columns:1fr;gap:8px}.signal-route{gap:24px}.signal-stage{min-height:380px;padding:38px 28px}}
    @media(max-width:600px){.wrap{width:min(100% - 28px,1180px)}.mast{font-size:9px}.hero{padding-top:38px}.hero h1{font-size:clamp(47px,15vw,72px);letter-spacing:-.035em;word-spacing:.11em}.console{width:min(75vw,290px)}.transmission{padding:78px 0}.transmission-head{margin-bottom:38px}.signal-stage{min-height:560px;padding:38px 24px}.signal-route{grid-template-columns:1fr;gap:42px}.signal-route:before{left:50%;right:auto;top:10%;bottom:10%;width:1px;height:auto}.packet{left:calc(50% - 4px);top:10%;animation:route-y 2.5s cubic-bezier(.65,0,.35,1) infinite}.node{min-height:105px}.stage-caption{font-size:8px}.countdown{display:none}.closing{padding-top:95px}}
    @keyframes route-y{0%{top:10%;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:89%;opacity:0}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}.reveal{opacity:1;transform:none}}
  </style>
</head>
<body>
  <header class="mast wrap" aria-label="Transmission status">
    <div class="ready"><span class="dot" aria-hidden="true"></span><span>Signal detected</span></div>
    <div class="countdown"><span>Transmission 01</span><span>Incoming</span></div>
  </header>

  <main>
    <section class="hero wrap">
      <div class="hero-grid">
        <div>
          <p class="eyebrow">Transmission incoming</p>
          <h1><span>The "P"</span><span class="outline">Is for</span><span class="outline">Your Plays</span></h1>
          <span class="tagline">PSynced · Coming soon</span>
        </div>
        <div class="console" aria-hidden="true">
          <div class="orbit"></div><div class="orbit two"></div><div class="orbit three"></div><div class="console-core"></div><div class="console-label">Signal locked</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function(){
      var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var reveals=[].slice.call(document.querySelectorAll('.reveal'));
      if(reduced||!('IntersectionObserver' in window)){
        reveals.forEach(function(el){el.classList.add('seen')});
      }else{
        var observer=new IntersectionObserver(function(entries){
          entries.forEach(function(entry){if(entry.isIntersecting){entry.target.classList.add('seen');observer.unobserve(entry.target)}});
        },{threshold:.12});
        reveals.forEach(function(el){observer.observe(el)});
      }
    }());
  </script>
